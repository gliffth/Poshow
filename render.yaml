# Render Blueprint: New > Blueprint > select this repository.
services:
  - type: web
    name: poshow
    runtime: python
    # The free plan sleeps after 15 minutes idle; a paid plan stays on (docs/DEPLOY.md). Keep one worker.
    plan: free
    # Use the same region as the Supabase project.
    region: oregon
    branch: main
    # Root directory: repository root (leave empty).
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.index:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*' --timeout-keep-alive 65
    healthCheckPath: /api/health
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY      # service_role key
        sync: false
      - key: BOT_USERNAME      # bot username without @
        sync: false
      - key: ADMIN_USERNAMES   # comma-separated web usernames
        sync: false
      - key: ADMIN_USER_IDS    # comma-separated user ids
        sync: false
      - key: ALLOWED_ORIGINS   # e.g. https://poshow.vercel.app
        sync: false
      - key: AUTH_SECRET       # signs login tokens; generated by Render
        generateValue: true
